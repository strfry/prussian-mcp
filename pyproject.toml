[project]
name = "prussian-mcp"
version = "0.1.0"
description = "Prussian dictionary MCP server and `prussian-agent` CLI"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mcp>=1.28",
    "model2vec>=0.3.0",
    "numpy==2.0.2",
    "openai>=2.45.0",
    "prussian-fst",
    "pyhfst>=1.4.0",
    "smolagents>=1.26",
    "pillow>=10.0.1,<11.0.0",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
# Only needed for the `--mcp-url` remote-toolset path of `prussian-agent`.
# The default in-process toolset does not require this.
remote = []
# model2vec.distill() — used to distill a custom-vocabulary static model.
# torch comes from the PyTorch XPU wheel index (Intel Arc GPU on this host).
distill = ["model2vec[distill]>=0.3.0", "torch>=2.10"]
# inspect-ai reconstruction eval (evals/ + prussian.adapters.inspect_tools).
eval = ["inspect-ai"]

[project.scripts]
prussian-agent = "prussian.adapters.agent.cli:main"
prussian-mcp = "prussian.adapters.mcp:main"
validate = "prussian.tools.validate:main"
search = "prussian.tools.search:main"
lookup = "prussian.tools.lookup:main"
wordforms = "prussian.tools.wordforms:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prussian"]

# prussian-fst wird editierbar aus dem Geschwister-Checkout eingebunden
# (In-Process-Import der FST/CG3-Pipeline statt Subprozess).  Liegt der
# Checkout woanders, diesen Pfad anpassen und `uv sync` erneut ausführen.
# Voraussetzung: dort gebaute Artefakte (make -C <checkout>/fst all cg3-check).
[tool.uv.sources]
prussian-fst = { path = "../prussian-fst", editable = true }
